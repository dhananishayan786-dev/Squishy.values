<head>

  <title>Squishy Values</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f0ff;
      margin: 0;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }

    input, select, button {
      padding: 11px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    input {
      width: calc(100% - 10px);
    }

    select {
      width: 70%;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .trade {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .result {
      text-align: center;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #eee;
      font-weight: bold;
    }

    .rare {
      font-weight: bold;
    }

    @media(max-width:600px) {
      .trade {
        grid-template-columns: 1fr;
      }

      select {
        width: 65%;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 7px;
      }
    }
  </style>
</head>

/* ================= TRADE CALCULATOR ================= */

let yourItems = [];
let theirItems = [];

function showValues() {

  const search =
    document.getElementById("search").value.toLowerCase();

  const list =
    document.getElementById("valueList");

  list.innerHTML = "";

  items
    .filter(item =>
      item.name.toLowerCase().includes(search)
    )
    .sort((a,b) => b.value - a.value)
    .forEach(item => {

      const row =
        document.createElement("tr");

      if (item.value >= 300) {
        row.className = "rare";
      }

      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.value}</td>
        <td>${item.demand}</td>
        <td>${item.popularity}</td>
      `;

      list.appendChild(row);
    });
}

function loadItems() {

  const your =
    document.getElementById("yourItem");

  const their =
    document.getElementById("theirItem");

  your.innerHTML = "";
  their.innerHTML = "";

  items
    .map((item,index) => ({item,index}))
    .sort((a,b) => b.item.value - a.item.value)
    .forEach(({item,index}) => {

      your.innerHTML += `
        <option value="${index}">
          ${item.name} — ${item.value}
        </option>
      `;

      their.innerHTML += `
        <option value="${index}">
          ${item.name} — ${item.value}
        </option>
      `;
    });
}

function addYour() {

  const index =
    Number(document.getElementById("yourItem").value);

  yourItems.push(items[index]);

  update();
}

function addTheir() {

  const index =
    Number(document.getElementById("theirItem").value);

  theirItems.push(items[index]);

  update();
}

function update() {

  let yourTotal = 0;
  let theirTotal = 0;

  const yourList =
    document.getElementById("yourList");

  const theirList =
    document.getElementById("theirList");

  yourList.innerHTML = "";
  theirList.innerHTML = "";

  yourItems.forEach(item => {

    yourTotal += item.value;

    yourList.innerHTML +=
      `<li>${item.name} (${item.value})</li>`;
  });

  theirItems.forEach(item => {

    theirTotal += item.value;

    theirList.innerHTML +=
      `<li>${item.name} (${item.value})</li>`;
  });

  document.getElementById("yourTotal").textContent =
    yourTotal;

  document.getElementById("theirTotal").textContent =
    theirTotal;

  const result =
    document.getElementById("result");

  if (
    yourItems.length === 0 ||
    theirItems.length === 0
  ) {

    result.textContent =
      "Add items to calculate the trade";

  } else if (yourTotal < theirTotal) {

    result.textContent =
      `W for you • +${theirTotal - yourTotal} value`;

  } else if (yourTotal > theirTotal) {

    result.textContent =
      `L for you • -${yourTotal - theirTotal} value`;

  } else {

    result.textContent =
      "Fair trade";
  }
}

showValues();
loadItems();
update();

</script>
