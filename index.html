<html lang="en">
<head>
<meta charset="UTF-8">

<title>Squishy Values</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f1e8;
  color: #29272b;
}

/* ================= HEADER ================= */

header {
  background: #f5f1e8;
  padding: 22px 18px 18px;
  text-align: center;
  border-bottom: 1px solid #ebe5da;
  position: relative;
}

header h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -2px;
}

header p {
  margin: 7px 0 0;
  color: #77736f;
  font-size: 13px;
}

.menu {
  position: absolute;
  left: 18px;
  top: 22px;
  font-size: 26px;
  color: #555;
}

.signin {
  position: absolute;
  right: 15px;
  top: 15px;
  background: #171619;
  color: white;
  padding: 12px 22px;
  border-radius: 25px;
  font-size: 14px;
}

/* ================= CONTAINER ================= */

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px 14px 60px;
}

/* ================= CARDS ================= */

.card {
  background: rgba(255,255,255,.5);
  border: 1px solid white;
  padding: 20px;
  margin-bottom: 22px;
  border-radius: 28px;
  box-shadow: 0 5px 25px rgba(0,0,0,.04);
}

.card h2 {
  text-align: center;
  margin: 5px 0 18px;
}

/* ================= SEARCH ================= */

input {
  width: 100%;
  padding: 15px 18px;
  border-radius: 18px;
  border: 1px solid #ddd5c8;
  background: #fffaf2;
  font-size: 15px;
  outline: none;
  margin-bottom: 15px;
}

input:focus {
  border-color: #ff7378;
}

/* ================= TABLE ================= */

.tableWrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255,255,255,.55);
  border-radius: 18px;
  overflow: hidden;
}

th {
  background: #eee8dc;
  color: #66615d;
  font-size: 13px;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #e8e1d6;
  text-align: left;
}

td {
  font-size: 14px;
}

.rare {
  font-weight: 800;
}

/* ================= TRADE AREA ================= */

.trade {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.tradeSide {
  background: rgba(255,255,255,.5);
  border: 1px solid white;
  border-radius: 25px;
  padding: 15px;
}

.tradeSide h3 {
  text-align: center;
  margin: 5px 0 14px;
}

/* ================= SELECT ================= */

select {
  width: calc(100% - 78px);
  padding: 13px;
  border-radius: 15px;
  border: 1px solid #ddd5c8;
  background: white;
  font-size: 13px;
}

/* ================= BUTTON ================= */

button {
  padding: 13px 16px;
  border: none;
  border-radius: 18px;
  background: #ff6f73;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

/* ================= ITEMS ================= */

ul {
  list-style: none;
  padding: 0;
  margin: 15px 0;
}

li {
  background: white;
  margin: 6px 0;
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
}

.itemValue {
  float: right;
  font-weight: bold;
}

.removeBtn {
  float: right;
  margin-left: 8px;
  padding: 2px 7px;
  background: #ddd;
  color: #555;
  border-radius: 50%;
}

/* ================= TOTAL ================= */

.total {
  text-align: center;
  font-size: 20px;
  font-weight: 800;
}

#yourTotal {
  color: #ff6269;
}

#theirTotal {
  color: #555;
}

/* ================= RESULT ================= */

.result {
  text-align: center;
  padding: 20px;
  margin-top: 20px;
  border-radius: 25px;
  font-size: 20px;
  font-weight: 800;
}

.neutral {
  background: #eee9df;
  color: #666;
}

.win {
  background: #dff5df;
  color: #26933b;
}

.fair {
  background: #fff0c9;
  color: #b57b00;
}

.lose {
  background: #ffe0e0;
  color: #d33a3a;
}

/* ================= TRADE BAR ================= */

.tradeBar {
  height: 10px;
  background: #f4c7c7;
  border-radius: 10px;
  margin-top: 15px;
  overflow: hidden;
}

.tradeBarFill {
  height: 100%;
  width: 50%;
  background: linear-gradient(90deg,#ff8a00,#ff6269);
  border-radius: 10px;
  transition: width .3s;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

  header {
    padding-top: 24px;
  }

  header h1 {
    font-size: 29px;
  }

  header p {
    font-size: 11px;
  }

  .signin {
    padding: 10px 17px;
    font-size: 12px;
    top: 15px;
  }

  .menu {
    font-size: 23px;
  }

  .container {
    padding: 12px 10px 40px;
  }

  .card {
    border-radius: 25px;
    padding: 14px;
  }

  .trade {
    grid-template-columns: 1fr;
  }

  select {
    width: calc(100% - 75px);
  }

  th, td {
    padding: 9px 6px;
  }

  table {
    font-size: 11px;
  }

  th:nth-child(4),
  td:nth-child(4) {
    display: none;
  }

  .result {
    font-size: 17px;
  }
}
</style>
</head>

/* =========================================================
   TRADE CALCULATOR
========================================================= */

let yourItems = [];
let theirItems = [];


/* =========================================================
   VALUE LIST
========================================================= */

function showValues() {

  const search =
    document.getElementById("search").value.toLowerCase();

  const list =
    document.getElementById("valueList");

  list.innerHTML = "";

  const filtered = items
    .filter(item =>
      item.name.toLowerCase().includes(search)
    )
    .sort((a,b) => b.value - a.value);

  filtered.forEach(item => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="${item.demand === "Extreme" ? "rare" : ""}">
        ${item.name}
      </td>

      <td>${item.value}</td>

      <td>${item.demand}</td>

      <td>${item.popularity}</td>
    `;

    list.appendChild(row);

  });
}


/* =========================================================
   DROPDOWNS
========================================================= */

function loadItems() {

  const your =
    document.getElementById("yourItem");

  const their =
    document.getElementById("theirItem");

  your.innerHTML =
    `<option value="">Add an item...</option>`;

  their.innerHTML =
    `<option value="">Add an item...</option>`;

  const sorted =
    [...items].sort((a,b) => b.value - a.value);

  sorted.forEach((item,index) => {

    your.innerHTML += `
      <option value="${index}">
        ${item.name} — ${item.value}
      </option>
    `;

    their.innerHTML += `
      <option value="${index}">
        ${item.name} — ${item.value}
      </option>
    `;

  });

  window.sortedItems = sorted;
}


/* =========================================================
   ADD YOUR ITEM
========================================================= */

function addYour() {

  const select =
    document.getElementById("yourItem");

  if (select.value === "") return;

  yourItems.push(
    window.sortedItems[select.value]
  );

  select.value = "";

  update();
}


/* =========================================================
   ADD THEIR ITEM
========================================================= */

function addTheir() {

  const select =
    document.getElementById("theirItem");

  if (select.value === "") return;

  theirItems.push(
    window.sortedItems[select.value]
  );

  select.value = "";

  update();
}


/* =========================================================
   REMOVE YOUR ITEM
========================================================= */

function removeYour(index) {

  yourItems.splice(index,1);

  update();
}


/* =========================================================
   REMOVE THEIR ITEM
========================================================= */

function removeTheir(index) {

  theirItems.splice(index,1);

  update();
}


/* =========================================================
   UPDATE EVERYTHING
========================================================= */

function update() {

  const yourList =
    document.getElementById("yourList");

  const theirList =
    document.getElementById("theirList");

  yourList.innerHTML = "";
  theirList.innerHTML = "";


  /* YOUR ITEMS */

  yourItems.forEach((item,index) => {

    yourList.innerHTML += `
      <li>

        ${item.name}

        <button
          class="removeBtn"
          onclick="removeYour(${index})"
        >
          ×
        </button>

        <span class="itemValue">
          ${item.value}
        </span>

      </li>
    `;

  });


  /* THEIR ITEMS */

  theirItems.forEach((item,index) => {

    theirList.innerHTML += `
      <li>

        ${item.name}

        <button
          class="removeBtn"
          onclick="removeTheir(${index})"
        >
          ×
        </button>

        <span class="itemValue">
          ${item.value}
        </span>

      </li>
    `;

  });


  /* TOTALS */

  const yourTotal =
    yourItems.reduce(
      (sum,item) => sum + item.value,
      0
    );

  const theirTotal =
    theirItems.reduce(
      (sum,item) => sum + item.value,
      0
    );


  document.getElementById("yourTotal")
    .textContent = yourTotal;

  document.getElementById("theirTotal")
    .textContent = theirTotal;


  updateResult(yourTotal,theirTotal);

}


/* =========================================================
   WIN / FAIR / LOSE
========================================================= */

function updateResult(yourTotal,theirTotal) {

  const result =
    document.getElementById("result");

  const bar =
    document.getElementById("tradeBarFill");


  if (yourTotal === 0 && theirTotal === 0) {

    result.textContent =
      "Add items to calculate the trade";

    result.className =
      "result neutral";

    bar.style.width = "50%";

    return;
  }


  if (yourTotal === theirTotal) {

    result.textContent =
      "⚖️ FAIR TRADE";

    result.className =
      "result fair";

    bar.style.width = "50%";

    return;
  }


  if (theirTotal > yourTotal) {

    const difference =
      theirTotal - yourTotal;

    result.textContent =
      `🟢 WIN — You get ${difference} more value`;

    result.className =
      "result win";


    const percentage =
      Math.min(
        90,
        50 + (difference / Math.max(theirTotal,1)) * 50
      );

    bar.style.width =
      percentage + "%";

  }

  else {

    const difference =
      yourTotal - theirTotal;

    result.textContent =
      `🔴 LOSE — You give ${difference} more value`;

    result.className =
      "result lose";


    const percentage =
      Math.max(
        10,
        50 - (difference / Math.max(yourTotal,1)) * 50
      );

    bar.style.width =
      percentage + "%";

  }

}


/* =========================================================
   START WEBSITE
========================================================= */

loadItems();
showValues();
update();
