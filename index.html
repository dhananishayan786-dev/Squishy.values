<script>
/* ALL YOUR JAVASCRIPT GOES HERE */

let yourItems = [];
let theirItems = [];

function showValues() {
  const search = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("valueList");

  list.innerHTML = "";

  items
    .filter(item => item.name.toLowerCase().includes(search))
    .sort((a, b) => b.value - a.value)
    .forEach(item => {
      const row = document.createElement("tr");

      if (item.value >= 300) {
        row.className = "rare";
      }

      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.value}</td>
        <td>${item.demand}</td>
        <td>${item.popularity}</td>
      `;

      list.appendChild(row);
    });
}

function loadItems() {
  const your = document.getElementById("yourItem");
  const their = document.getElementById("theirItem");

  your.innerHTML = "";
  their.innerHTML = "";

  items
    .map((item, index) => ({ item, index }))
    .sort((a, b) => b.item.value - a.item.value)
    .forEach(({ item, index }) => {
      your.innerHTML += `<option value="${index}">${item.name} — ${item.value}</option>`;
      their.innerHTML += `<option value="${index}">${item.name} — ${item.value}</option>`;
    });
}

function addYour() {
  const index = Number(document.getElementById("yourItem").value);
  yourItems.push(items[index]);
  update();
}

function addTheir() {
  const index = Number(document.getElementById("theirItem").value);
  theirItems.push(items[index]);
  update();
}

function update() {
  let yourTotal = 0;
  let theirTotal = 0;

  const yourList = document.getElementById("yourList");
  const theirList = document.getElementById("theirList");

  yourList.innerHTML = "";
  theirList.innerHTML = "";

  yourItems.forEach(item => {
    yourTotal += item.value;
    yourList.innerHTML += `<li>${item.name} (${item.value})</li>`;
  });

  theirItems.forEach(item => {
    theirTotal += item.value;
    theirList.innerHTML += `<li>${item.name} (${item.value})</li>`;
  });

  document.getElementById("yourTotal").textContent = yourTotal;
  document.getElementById("theirTotal").textContent = theirTotal;

  const result = document.getElementById("result");

  if (yourItems.length === 0 || theirItems.length === 0) {
    result.textContent = "Add items to calculate the trade";
  } else if (yourTotal < theirTotal) {
    result.textContent = `WIN 🎉 +${theirTotal - yourTotal} value`;
  } else if (yourTotal > theirTotal) {
    result.textContent = `LOSE 💔 -${yourTotal - theirTotal} value`;
  } else {
    result.textContent = "FAIR 🤝";
  }
}

showValues();
loadItems();
update();
</script>

</body>
</html>
