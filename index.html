<!DOCTYPE html>
<html>
<head>
  <title>Squishy Values</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #f4f0ff;
      margin: 0;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      text-align: center;
      padding: 30px;
    }
    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }
    input, select, button {
      padding: 11px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.85;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    .trade {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .result {
      text-align: center;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #eee;
      font-weight: bold;
    }
    @media(max-width:600px) {
      .trade {
        grid-template-columns: 1fr;
      }
      table {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Squishy Values</h1>
  <p>Values • Demand • Popularity • Trade Calculator</p>
</header>
<div class="container">
  <div class="card">
    <h2>Value List</h2>
    <input
      id="search"
      placeholder="Search squishies..."
      oninput="showValues()"
    >
    <table>
      <thead>
        <tr>
          <th>Squishy</th>
          <th>Value</th>
          <th>Demand</th>
          <th>Popularity</th>
        </tr>
      </thead>
      <tbody id="valueList"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>Trade Calculator</h2>
    <div class="trade">
      <div>
        <h3>Your Items</h3>
        <select id="yourItem"></select>
        <button onclick="addYour()">Add</button>
        <ul id="yourList"></ul>
        <b>Total: <span id="yourTotal">0</span></b>
      </div>
      <div>
        <h3>Their Items</h3>
        <select id="theirItem"></select>
        <button onclick="addTheir()">Add</button>
        <ul id="theirList"></ul>
        <b>Total: <span id="theirTotal">0</span></b>
      </div>
    </div>
    <div class="result" id="result">
      Add items to calculate the trade
    </div>
  </div>
</div>

let yourItems = [];
let theirItems = [];
function showValues() {
  const search =
    document.getElementById("search").value.toLowerCase();
  const list =
    document.getElementById("valueList");
  list.innerHTML = "";
  items
    .filter(item =>
      item.name.toLowerCase().includes(search)
    )
    .forEach(item => {
      list.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.value}</td>
          <td>${item.demand}</td>
          <td>${item.popularity}</td>
        </tr>
      `;
    });
}
function loadItems() {
  const your =
    document.getElementById("yourItem");
  const their =
    document.getElementById("theirItem");
  items.forEach((item, index) => {
    your.innerHTML +=
      `<option value="${index}">
        ${item.name} — ${item.value}
      </option>`;
    their.innerHTML +=
      `<option value="${index}">
        ${item.name} — ${item.value}
      </option>`;
  });
}
function addYour() {
  const index =
    document.getElementById("yourItem").value;
  yourItems.push(items[index]);
  update();
}
function addTheir() {
  const index =
    document.getElementById("theirItem").value;
  theirItems.push(items[index]);
  update();
}
function update() {
  let yourTotal = 0;
  let theirTotal = 0;
  const yourList =
    document.getElementById("yourList");
  const theirList =
    document.getElementById("theirList");
  yourList.innerHTML = "";
  theirList.innerHTML = "";
  yourItems.forEach(item => {
    yourTotal += item.value;
    yourList.innerHTML +=
      `<li>${item.name} (${item.value})</li>`;
  });
  theirItems.forEach(item => {
    theirTotal += item.value;
    theirList.innerHTML +=
      `<li>${item.name} (${item.value})</li>`;
  });
  document.getElementById("yourTotal").textContent =
    yourTotal;
  document.getElementById("theirTotal").textContent =
    theirTotal;
  const result =
    document.getElementById("result");
  if (yourItems.length === 0 || theirItems.length === 0) {
    result.textContent =
      "Add items to calculate the trade";
  }
  else if (yourTotal > theirTotal) {
    result.textContent =
      "W for you";
  }
  else if (yourTotal < theirTotal) {
    result.textContent =
      "L for you";
  }
  else {
    result.textContent =
      "Fair trade";
  }
}
showValues();
loadItems();
